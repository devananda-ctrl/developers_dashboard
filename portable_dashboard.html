<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quin QA Bug & Release Dashboard (Portable Cloud Edition)</title>
  
  <!-- React & Babel CDNs for standalone browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #121827;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #2563eb;
      --accent-cyan: #00f2fe;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
      --accent-purple: #8b5cf6;
      --text-main: #f0f4f8;
      --text-muted: #8e9bb0;
      --input-bg: #1a2234;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; font-size: 14px; }
    code, pre { font-family: 'JetBrains Mono', monospace; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #2a364f; border-radius: 4px; }

    /* App Container */
    .app-container { max-width: 1540px; margin: 0 auto; padding: 1.25rem; }

    /* Top Navbar */
    .top-navbar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .header-brand-tier { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .brand-section { display: flex; align-items: center; gap: 0.75rem; }
    .logo-badge {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #090d16;
      font-weight: 900;
      font-size: 1rem;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      letter-spacing: 1px;
    }
    .brand-title { font-size: 1.2rem; font-weight: 700; background: linear-gradient(90deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lan-badge { font-size: 0.75rem; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 0.2rem 0.5rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(56, 189, 248, 0.2); }

    .user-session-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .user-session-box { display: flex; align-items: center; gap: 0.5rem; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border); padding: 0.4rem 0.75rem; border-radius: 8px; font-size: 0.85rem; }
    
    .header-menu-tier { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; border-top: 1px solid var(--card-border); padding-top: 0.85rem; }

    /* Environment Switcher */
    .env-switcher { display: flex; background: #0c1220; border-radius: 8px; padding: 3px; border: 1px solid var(--card-border); }
    .env-btn { border: none; background: transparent; color: var(--text-muted); padding: 0.4rem 0.85rem; font-size: 0.82rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
    .env-btn.active.prod { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .env-btn.active.dev { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }

    /* Buttons */
    .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 0.55rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--card-border); padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.82rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s ease; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }
    .btn-logout { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .action-buttons-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

    /* Category Tabs */
    .tabs-container { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 0.6rem 1.1rem; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; transition: all 0.2s ease; }
    .tab-btn:hover { color: var(--text-main); border-color: rgba(255, 255, 255, 0.2); }
    .tab-btn.active { background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(0, 242, 254, 0.1)); color: #60a5fa; border-color: #3b82f6; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }

    /* Filters Bar */
    .filters-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1rem; margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; }
    .search-box { flex: 1; min-width: 240px; position: relative; }
    .search-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 0.6rem 0.85rem 0.6rem 2.2rem; border-radius: 8px; font-size: 0.88rem; outline: none; }

    .filter-selects { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .form-select, select { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 0.55rem 0.75rem; border-radius: 8px; font-size: 0.85rem; outline: none; }
    select option, .form-select option, option { background-color: #121827 !important; color: #ffffff !important; padding: 0.6rem 0.8rem; font-size: 0.9rem; }
    select option:checked, option:checked { background-color: #2563eb !important; color: #ffffff !important; }

    /* Table Component */
    .table-container { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
    .bugs-table { width: 100%; border-collapse: collapse; text-align: left; }
    .bugs-table th { background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.85rem 1rem; border-bottom: 1px solid var(--card-border); }
    .bugs-table td { padding: 0.85rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.88rem; vertical-align: middle; }
    .bugs-table tr:hover { background: rgba(255, 255, 255, 0.02); }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge-critical { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-high { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-medium { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-low { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .bug-key-badge { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 0.2rem 0.5rem; border-radius: 5px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .platform-pill { display: inline-flex; align-items: center; justify-content: center; padding: 0.22rem 0.6rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; user-select: none; }
    .platform-pill-android { background: rgba(16, 185, 129, 0.18) !important; color: #34d399 !important; border: 1px solid rgba(16, 185, 129, 0.4) !important; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
    .platform-pill-ios { background: rgba(56, 189, 248, 0.18) !important; color: #38bdf8 !important; border: 1px solid rgba(56, 189, 248, 0.4) !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    .platform-pill-web { background: rgba(168, 85, 247, 0.18) !important; color: #c084fc !important; border: 1px solid rgba(168, 85, 247, 0.4) !important; box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
    .platform-pill-backend { background: rgba(245, 158, 11, 0.18) !important; color: #fbbf24 !important; border: 1px solid rgba(245, 158, 11, 0.4) !important; box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
    .platform-pill-other { background: rgba(6, 182, 212, 0.18) !important; color: #22d3ee !important; border: 1px solid rgba(6, 182, 212, 0.4) !important; }
    .signoff-chip { font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 6px; display: inline-flex; align-items: center; }

    /* Modal Overlay */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
    .modal-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .modal-body { padding: 1.25rem; }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .close-btn:hover { color: #fff; }

    /* Form Fields */
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .form-input, .form-textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 0.6rem 0.85rem; border-radius: 8px; font-size: 0.88rem; outline: none; }
    .form-textarea { min-height: 90px; resize: vertical; }

    /* Landing Card */
    .landing-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; background: radial-gradient(circle at top, #1e293b, #090d16); }
    .landing-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; width: 100%; max-width: 440px; padding: 2.25rem; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .landing-logo { display: inline-block; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #090d16; font-weight: 900; font-size: 1.25rem; padding: 0.4rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .landing-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.4rem; }
    .landing-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // DEFAULT WEBHOOK URL
    const DEFAULT_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwIT4MqkJjnM7Y0EfXMWDkDY0ygStoExkVy0NrRi8nJxLIR2o6u2Zswznw6kP8NbvhG/exec';

    // INITIAL BUGSEE SAMPLE DATASET FOR PORTABLE MODE
    const INITIAL_BUGSEE_DATA = [
      {
        id: 101,
        bug_key: 'BLE-00042',
        external_id: 'BUGSEE-1685',
        bug_prefix: 'BLE',
        bug_sequence: 42,
        title: 'ConcurrentModificationException at BleScanner.onScanResult',
        platform: 'Android',
        product: 'Quin Within',
        environment: 'Prod',
        version: '1.1.2',
        build_number: '518',
        severity: 'Critical',
        category: 'BLE / Connectivity',
        source: 'Bugsee',
        status: 'Active',
        reporter: 'Bugsee Crash Engine',
        assigned_to: 'John Doe',
        description: 'Automatic crash report from Bugsee. BleScanner array mutated during iteration.',
        bugsee_url: 'https://app.bugsee.com/projects/quin-app/issues/BUGSEE-1685',
        stack_trace: 'java.util.ConcurrentModificationException\n  at java.util.ArrayList$Itr.next(ArrayList.java:860)\n  at com.quin.within.ble.BleScanner.onScanResult(BleScanner.kt:142)\n  at android.bluetooth.le.BluetoothLeScanner$1.onScanResult(BluetoothLeScanner.java:210)',
        console_logs: '[14:22:01.002] INFO: Scanning for Quin Smart Helmet BLE advertisement...\n[14:22:02.115] DEBUG: Device discovered MAC=AA:BB:CC:DD:EE:FF RSSI=-54dBm\n[14:22:02.119] ERROR: ConcurrentModificationException in list iteration!',
        breadcrumbs: '1. App Launch\n2. Bluetooth Turned ON\n3. Start Quin Helmet Scan\n4. Device Discovered\n5. Crash on UI Update',
        device_model: 'Samsung Galaxy S22',
        os_version: 'Android 14 (API 34)',
        created_at: new Date().toISOString()
      },
      {
        id: 102,
        bug_key: 'UI-00015',
        external_id: 'BUGSEE-1661',
        bug_prefix: 'UI',
        bug_sequence: 15,
        title: 'NullPointerInObserver: DashboardFragment.observerViewModels$lambda$53',
        platform: 'Android',
        product: 'Quin Within',
        environment: 'Prod',
        version: '1.1.2',
        build_number: '518',
        severity: 'Critical',
        category: 'Crash',
        source: 'Bugsee',
        status: 'Active',
        reporter: 'Bugsee Crash Engine',
        assigned_to: 'Alice Smith',
        description: 'ViewModel reference lost during configuration change',
        bugsee_url: 'https://app.bugsee.com/projects/quin-app/issues/BUGSEE-1661',
        stack_trace: 'java.lang.NullPointerException: Attempt to invoke virtual method on a null object reference\n  at com.quin.within.ui.DashboardFragment.lambda$53(DashboardFragment.kt:98)',
        console_logs: '[14:10:00.111] INFO: DashboardFragment initialized\n[14:10:01.220] WARN: ViewModel reference lost during configuration change',
        breadcrumbs: '1. Navigate to Dashboard\n2. Rotate Screen\n3. LiveData Triggered\n4. Null Pointer Crash',
        device_model: 'Google Pixel 7 Pro',
        os_version: 'Android 14',
        created_at: new Date().toISOString()
      }
    ];

    function StandaloneDashboard() {
      // Config & Webhook State
      const [webhookUrl, setWebhookUrl] = useState(() => localStorage.getItem('quin_portable_webhook') || DEFAULT_WEBHOOK_URL);
      const [syncStatus, setSyncStatus] = useState('Idle');
      const [lastSyncTimestamp, setLastSyncTimestamp] = useState(() => new Date().toLocaleTimeString());
      const [showSyncModal, setShowSyncModal] = useState(false);

      // Auth State
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('quin_portable_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState(null);

      // Navigation & Filters
      const [activeEnvironment, setActiveEnvironment] = useState('Prod');
      const [activePlatform, setActivePlatform] = useState(() => {
        const saved = localStorage.getItem('quin_portable_platform');
        if (saved && (saved.toLowerCase() === 'watch' || saved.toLowerCase() === 'android tab' || saved.toLowerCase() === 'android_tab')) {
          return 'All Platforms';
        }
        return saved || 'All Platforms';
      });
      const [activeProduct, setActiveProduct] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [severityFilter, setSeverityFilter] = useState('All');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [sourceFilter, setSourceFilter] = useState('All');

      // Issue Detail Drawer State
      const [showIssueDetailModal, setShowIssueDetailModal] = useState(false);
      const [selectedBugDetail, setSelectedBugDetail] = useState(null);
      const [detailActiveTab, setDetailActiveTab] = useState('qa');

      // Data States with LocalStorage Cache Backup (Array Validated)
      const [bugs, setBugs] = useState(() => {
        try {
          const saved = localStorage.getItem('quin_portable_bugs');
          const parsed = saved ? JSON.parse(saved) : null;
          return Array.isArray(parsed) ? parsed : INITIAL_BUGSEE_DATA;
        } catch (e) { return INITIAL_BUGSEE_DATA; }
      });
      const [builds, setBuilds] = useState(() => {
        try {
          const saved = localStorage.getItem('quin_portable_builds');
          const parsed = saved ? JSON.parse(saved) : null;
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) { return []; }
      });
      const defaultPlatforms = ['iOS', 'Android', 'Backend', 'Web'];
      const [platforms, setPlatforms] = useState(() => {
        try {
          const saved = localStorage.getItem('quin_portable_platforms');
          const parsed = saved ? JSON.parse(saved) : null;
          if (Array.isArray(parsed)) {
            const filtered = parsed.filter(p => !['watch', 'android tab', 'android_tab'].includes(String(p).toLowerCase()));
            return filtered.length > 0 ? filtered : defaultPlatforms;
          }
          return defaultPlatforms;
        } catch (e) { return defaultPlatforms; }
      });
      const [showPlatformModal, setShowPlatformModal] = useState(false);
      const [newPlatformName, setNewPlatformName] = useState('');
      const [showAddBugModal, setShowAddBugModal] = useState(false);
      const [showTrashModal, setShowTrashModal] = useState(false);

      // Team Reminder State
      const [showReminderModal, setShowReminderModal] = useState(false);
      const [reminderSelectedTeam, setReminderSelectedTeam] = useState('Android');
      const [reminderRecipients, setReminderRecipients] = useState('bindu.hait@quintessential.design, sampan@quintessential.design, vishnu.k@quintessential.design');
      const [reminderCc, setReminderCc] = useState('devanand.a@quintessential.design, leonard@quintessential.design, chethana.raj@quintessential.design');
      const [reminderSubject, setReminderSubject] = useState('');
      const [reminderCustomNote, setReminderCustomNote] = useState('Please review and resolve the following pending QA issues assigned to your team.');
      const [selectedReminderBugIds, setSelectedReminderBugIds] = useState([]);

      // Integration Base Domain URLs
      const [jiraBaseUrl, setJiraBaseUrl] = useState(() => localStorage.getItem('quin_jira_base_url') || 'https://quin.atlassian.net');
      const [bugseeBaseUrl, setBugseeBaseUrl] = useState(() => localStorage.getItem('quin_bugsee_base_url') || 'https://app.bugsee.com/#/projects/quin-app');

      // Dynamic URL Resolution Helper for Jira, Bugsee, Drive, or Custom External Links
      const getEffectiveBugUrl = (bug) => {
        if (!bug) return '#';
        if (bug.jira_url && typeof bug.jira_url === 'string' && bug.jira_url.trim().startsWith('http')) return bug.jira_url.trim();
        if (bug.bugsee_url && typeof bug.bugsee_url === 'string' && bug.bugsee_url.trim().startsWith('http')) return bug.bugsee_url.trim();
        if (bug.external_url && typeof bug.external_url === 'string' && bug.external_url.trim().startsWith('http')) return bug.external_url.trim();
        if (bug.drive_url && typeof bug.drive_url === 'string' && bug.drive_url.trim().startsWith('http')) return bug.drive_url.trim();

        if (bug.source === 'Jira' || (bug.external_id && (bug.external_id.startsWith('QUIN') || bug.external_id.startsWith('QDB')))) {
          const jKey = bug.external_id || bug.bug_key || '';
          const cleanJiraBase = (jiraBaseUrl || 'https://quin.atlassian.net').replace(/\/+$/, '');
          return jKey ? `${cleanJiraBase}/browse/${jKey}` : cleanJiraBase;
        }

        if (bug.source === 'Bugsee' || (bug.external_id && bug.external_id.startsWith('BUGSEE'))) {
          const bKey = bug.external_id || bug.bug_key || '';
          let cleanBugseeBase = (bugseeBaseUrl || 'https://app.bugsee.com/#/projects/quin-app').replace(/\/+$/, '');
          if (cleanBugseeBase.includes('app.bugsee.com') && !cleanBugseeBase.includes('/#/')) {
            cleanBugseeBase = cleanBugseeBase.replace('app.bugsee.com/', 'app.bugsee.com/#/');
          }
          if (cleanBugseeBase.endsWith('/issues')) return `${cleanBugseeBase}/${bKey}`;
          return `${cleanBugseeBase}/issues/${bKey}`;
        }

        return bug.drive_url || bug.attachment_path || '#';
      };

      // Auto-save local cache whenever bugs or builds change
      useEffect(() => {
        if (bugs.length > 0) localStorage.setItem('quin_portable_bugs', JSON.stringify(bugs));
      }, [bugs]);

      useEffect(() => {
        if (builds.length > 0) localStorage.setItem('quin_portable_builds', JSON.stringify(builds));
      }, [builds]);

      useEffect(() => {
        if (platforms.length > 0) localStorage.setItem('quin_portable_platforms', JSON.stringify(platforms));
      }, [platforms]);

      const handleAddPlatform = (e) => {
        e.preventDefault();
        const pName = newPlatformName.trim();
        if (!pName) return;
        if (platforms.some(p => p.toLowerCase() === pName.toLowerCase())) {
          alert('Platform already exists!');
          return;
        }
        const updated = [...platforms, pName];
        setPlatforms(updated);
        setActivePlatform(pName);
        setNewPlatformName('');
        setShowPlatformModal(false);
      };

      const handleDeletePlatform = (platformName) => {
        if (!confirm(`Are you sure you want to delete platform "${platformName}"?`)) return;
        const updated = platforms.filter(p => p.toLowerCase() !== platformName.toLowerCase());
        setPlatforms(updated);
        if (activePlatform.toLowerCase() === platformName.toLowerCase()) {
          setActivePlatform('All Platforms');
        }
      };

      // Metadata
      const severities = [
        { id: 1, name: 'Critical' }, { id: 2, name: 'High' }, { id: 3, name: 'Medium' }, { id: 4, name: 'Low' }

      const calculateAvailablePrefixes = () => {
        const officialPrefixes = ['AND', 'IOS', 'WEB', 'BEND', 'BLE', 'CRASH', 'UI', 'BE', 'FUNC', 'BUG'];
        const prefixMap = {};
        const hiddenSet = new Set(hiddenPrefixes.map(h => String(h).toUpperCase()));

        officialPrefixes.forEach(p => {
          if (!hiddenSet.has(p)) prefixMap[p] = 0;
        });

        Object.keys(prefixSequences).forEach(p => {
          if (!['BUGSEE', 'QDB', 'PLO', 'BLEFH', 'IOSSE'].includes(p) && !hiddenSet.has(p)) {

              prefixMap[p] = seq;
            }
          }

        return Object.keys(prefixMap).map(p => {
          const currentMax = prefixMap[p] || 0;
          let nextSeq = 1;
          if (currentMax > 0) nextSeq = currentMax + 1;
          else if (['AND', 'IOS', 'WEB', 'BEND'].includes(p)) nextSeq = 1;

          .filter(b => {
            if (buildMatrixStatusFilter === 'WithActiveBugs') return b.stats.active > 0;
            if (buildMatrixStatusFilter === 'Clean') return b.stats.active === 0;
            if (buildMatrixStatusFilter === 'Critical') return b.stats.critical > 0;
            return true;
          });
      };

      // Pull Latest Data from Google Sheet Web App (Safe Parse)
      const fetchSheetData = async () => {
        if (!webhookUrl) return;
        setSyncStatus('Syncing...');
        try {
          const res = await fetch(webhookUrl, { method: 'GET', redirect: 'follow' });
          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (parseErr) {
            console.warn('[GoogleSheetSync] Returned non-JSON html page, preserving local cache.');
            setSyncStatus('Local Cache');
            return;
          }
          if (data) {
            if (Array.isArray(data.bugs) && data.bugs.length > 0) {
              const cleanedBugs = data.bugs.map(b => {
                let p = b.platform || 'Android';
                let prod = b.product || 'Quin Within';
                if (p.toLowerCase() === 'watch' || p.toLowerCase() === 'android tab') {
                  p = (b.title && b.title.toLowerCase().includes('android')) ? 'Android' : 'iOS';
                  if (!prod.toLowerCase().includes('watch')) prod = 'Watch - Fly';
                }
                return { ...b, platform: p, product: prod };
              });
              setBugs(cleanedBugs);
            }
            if (Array.isArray(data.builds) && data.builds.length > 0) setBuilds(data.builds);
          }
          setSyncStatus('Synced');
          setLastSyncTimestamp(new Date().toLocaleTimeString());
        } catch (e) {
          console.error(e);
          setSyncStatus('Local Cache');
        }
      };

      // Bulletproof Google Sheet Web App POST Helper
      const sendPostToGoogleSheet = async (payload) => {
        if (!webhookUrl) return false;
        try {
          await fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: typeof payload === 'string' ? payload : JSON.stringify(payload)
          });
          setLastSyncTimestamp(new Date().toLocaleTimeString());
          return true;
        } catch (e) {
          console.warn('Primary fetch failed, attempting fallback sendBeacon...', e);
          try {
            if (navigator.sendBeacon) {
              const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
              navigator.sendBeacon(webhookUrl, blob);
              setLastSyncTimestamp(new Date().toLocaleTimeString());
              return true;
            }
          } catch (err) {
            console.error('All POST attempts failed:', err);
          }
          return false;
        }
      };

      // Push All Data to Google Sheet Web App
      const pushAllDataToSheet = async () => {
        if (!webhookUrl) return;
        setSyncStatus('Pushing...');
        const success = await sendPostToGoogleSheet({
          action: 'FULL_SYNC',
          bugs,
          builds,
          allData: { bugs, builds }
        });
        if (success) {
          setSyncStatus('Synced');
          setLastSyncTimestamp(new Date().toLocaleTimeString());
          alert('✅ Dataset successfully pushed to Google Sheet!');
        } else {
          setSyncStatus('Error');
          alert('⚠️ Push failed. Please check network connection.');
        }
      };

      // Initial Fetch & 15-Minute Auto-Sync Timer
      useEffect(() => {
        fetchSheetData();

        const autoSyncTimer = setInterval(async () => {
          if (webhookUrl) {
            setSyncStatus('AutoSync...');
            try {
              await sendPostToGoogleSheet({
                action: 'FULL_SYNC',
                bugs,
                builds,
                allData: { bugs, builds }
              });
              const res = await fetch(webhookUrl, { method: 'GET', redirect: 'follow' });
              const text = await res.text();
              try {
                const data = JSON.parse(text);
                if (data && Array.isArray(data.bugs) && data.bugs.length > 0) {
                  setBugs(data.bugs);
                }
              } catch (pErr) {}
              setSyncStatus('Synced');
              setLastSyncTimestamp(new Date().toLocaleTimeString());
            } catch (err) {
              console.error(err);
              setSyncStatus('Local Cache');
            }
          }
        }, 15 * 60 * 1000);

        return () => clearInterval(autoSyncTimer);
      }, [webhookUrl, bugs, builds]);

      // Handle opening Issue Detail Drawer
      const handleOpenBugDetail = (bug) => {
        setSelectedBugDetail(bug);

        setShowIssueDetailModal(true);
      };

      // Handle Syncing Historical Bugsee Issues in Portable Mode
      const handleSyncHistoricalBugsee = () => {
        const merged = [...INITIAL_BUGSEE_DATA];
        bugs.forEach(b => {
          if (!merged.find(x => x.bug_key === b.bug_key)) {
            merged.push(b);
          }
        });
        setBugs(merged);
        alert('⚡ Successfully imported 2 historical Bugsee crash reports!');
      };

      const handleUserLogin = (e) => {

        );
        if (user && (loginForm.password === 'quin123' || loginForm.password === 'admin123' || loginForm.password === 'dev123' || loginForm.password === 'qa123' || loginForm.password === 'viewer123' || loginForm.password === '123456')) {
          setCurrentUser(user);
          localStorage.setItem('quin_portable_user', JSON.stringify(user));
        } else {
          setLoginError('Invalid credentials. Default Password: quin123 (or admin123 for admin)');
        }
      };

      const handleGuestLogin = () => {
        const guestObj = { id: 0, username: 'Guest Viewer', email: 'guest@quin.app', role: 'Viewer' };
        setCurrentUser(guestObj);
        localStorage.setItem('quin_portable_user', JSON.stringify(guestObj));
      };

      const handleUserLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('quin_portable_user');
      };

      // Report Bug Form Handler
      const handleCreateBug = async (e) => {
        e.preventDefault();
        if (newBugForm.title.trim().length < 5) {
          alert('Title must be at least 5 characters long.');
          return;
        }

        let userKey = (newBugForm.custom_bug_key || '').trim();
        let cleanP = (newBugForm.bug_prefix || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!cleanP && userKey) {
          cleanP = userKey.split('-')[0].toUpperCase().replace(/[^A-Z0-9]/g, '');
        }
        if (!cleanP || cleanP.length < 2) cleanP = 'BUG';

        let parsedSeq = null;
        if (userKey && userKey.includes('-')) {
          const parts = userKey.split('-');
          cleanP = parts[0].toUpperCase().replace(/[^A-Z0-9]/g, '');
          const nP = parseInt(parts[1], 10);
          if (!isNaN(nP)) parsedSeq = nP;
        }

        let finalSeq = parsedSeq;
        if (finalSeq === null) {
          const avail = calculateAvailablePrefixes();
          const match = avail.find(a => a.prefix === cleanP);
          finalSeq = match ? match.nextSeq : (cleanP === 'IOS' || cleanP === 'AND' ? 1 : 1001);
        }

        let finalKey = `${cleanP}-${String(finalSeq).padStart(4, '0')}`;
        while (bugs.some(b => b.bug_key === finalKey && b.is_deleted !== 1)) {
          finalSeq++;
          finalKey = `${cleanP}-${String(finalSeq).padStart(4, '0')}`;
        }

        const newBug = {
          id: Date.now(),
          bug_key: finalKey,
          bug_prefix: cleanP,
          bug_sequence: finalSeq,
          title: newBugForm.title,
          platform: newBugForm.platform,
          product: newBugForm.product,
          environment: newBugForm.environment,
          feature_track: newBugForm.environment === 'Prod' ? 'General' : newBugForm.feature_track,
          version: newBugForm.version,
          build_number: newBugForm.build_number,
          severity: newBugForm.severity,
          category: newBugForm.category,
          source: 'Manual',
          status: 'Active',
          reporter: currentUser?.username || 'Devanand A',
          description: newBugForm.description,
          drive_url: newBugForm.drive_url || null,
          created_at: new Date().toISOString(),
          is_deleted: 0
        };

        const updated = [newBug, ...bugs];
        setBugs(updated);
        setPrefixSequences(prev => ({ ...prev, [cleanP]: finalSeq }));
        setShowAddBugModal(false);

        // Push to Google Sheet
        sendPostToGoogleSheet({ action: 'CREATE', table: 'bugs', data: newBug });
      };

      // Soft Delete Bug
      const handleDeleteBug = (bug) => {
        if (isViewer) return;
        if (!confirm(`Are you sure you want to delete bug [${bug.bug_key}]?`)) return;

        const updated = bugs.map(b => b.id === bug.id ? { ...b, is_deleted: 1, deleted_by: currentUser?.username, deleted_at: new Date().toISOString() } : b);
        setBugs(updated);

        sendPostToGoogleSheet({ action: 'DELETE', table: 'bugs', data: bug });
      };

      // Filtered Bugs
      const activeBugs = bugs.filter(b => {
        if (b.is_deleted === 1) return false;

        if (activePlatform !== 'All Platforms' && b.platform !== activePlatform) return false;

            if (!prod.includes('watch') && !title.includes('watch') && !dev.includes('watch')) return false;

        if (categoryFilter !== 'All' && b.category !== categoryFilter) return false;
        if (sourceFilter !== 'All' && (b.source || 'Manual') !== sourceFilter) return false;
        if (searchQuery && !b.title.toLowerCase().includes(searchQuery.toLowerCase()) && !b.bug_key.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        return true;
      });

                Continue as Guest Viewer

            </div>

      return (

              </div>

              <div className="user-session-row">
                <button 
                  className="btn-secondary" 
                  style={{ background: 'rgba(56, 189, 248, 0.1)', color: '#38bdf8', borderColor: 'rgba(56, 189, 248, 0.3)', padding: '0.4rem 0.75rem', fontSize: '0.8rem' }}
                  onClick={() => setShowSyncModal(true)}

                  🕒 Last Synced: {lastSyncTimestamp} (Auto: 15m)
                </button>

                <div className="user-session-box">
                  👤 <strong>{currentUser.username} ({currentUser.role})</strong>
                </div>
                <button className="btn-secondary btn-logout" onClick={handleUserLogout}>Log Out</button>

            </div>

            <div className="header-menu-tier">
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
                <div className="env-switcher">
                  <button

                    onClick={() => setMainTab('bugs')}
                  >
                    🐞 Bug Tracker
                  </button>
                  <button 
                    className={`env-btn ${mainTab === 'build_matrix' ? 'active dev' : ''}`}
                    style={{ background: mainTab === 'build_matrix' ? 'linear-gradient(135deg, #a855f7, #6366f1)' : 'transparent', color: '#fff' }}
                    onClick={() => setMainTab('build_matrix')}

                <div className="env-switcher">
                  <button className={`env-btn ${activeEnvironment === 'Prod' ? 'active prod' : ''}`} onClick={() => setActiveEnvironment('Prod')}>
                    Prod
                  </button>
                  <button className={`env-btn ${activeEnvironment === 'Dev' ? 'active dev' : ''}`} onClick={() => setActiveEnvironment('Dev')}>

              <div className="action-buttons-group">
                {!isViewer && (
                  <button className="btn-primary" onClick={() => {

                <button className="btn-secondary" style={{ color: '#38bdf8', borderColor: 'rgba(56, 189, 248, 0.4)' }} onClick={() => handleOpenReminderModal()}>

                <button className="btn-secondary" style={{ color: '#a78bfa', borderColor: 'rgba(167, 139, 250, 0.4)' }} onClick={pushAllDataToSheet}>

            </div>
          </header>

          {/* MAIN VIEW CONTENT: Build-Wise Bug Matrix vs Standard Bug Tracker */}
          {mainTab === 'build_matrix' ? (

                                ↺ Restore
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Manage Platforms Modal (Add & Delete) */}
          {showPlatformModal && (
            <div className="modal-overlay">
              <div className="modal-box" style={{ maxWidth: '520px' }}>
                <div className="modal-header">
                  <span className="modal-title">⚙️ Manage Platforms</span>
                  <button className="close-btn" onClick={() => setShowPlatformModal(false)}>✕</button>
                </div>
                <div className="modal-body">
                  <div style={{ marginBottom: '1.25rem' }}>
                    <label className="form-label" style={{ marginBottom: '0.5rem', display: 'block' }}>Existing Platforms</label>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem', maxHeight: '220px', overflowY: 'auto' }}>
                      {platforms.map(p => (
                        <div 
                          key={p} 
                          style={{ 
                            display: 'flex', 
                            justifyContent: 'space-between', 
                            alignItems: 'center', 
                            padding: '0.6rem 0.85rem', 
                            background: 'rgba(255, 255, 255, 0.04)', 
                            border: '1px solid var(--card-border)', 
                            borderRadius: '8px' 
                          }}
                        >
                          <span style={{ fontWeight: 600 }}>{p}</span>
                          <button 
                            type="button" 
                            className="btn-secondary" 
                            style={{ padding: '0.25rem 0.55rem', fontSize: '0.75rem', color: '#ef4444', borderColor: 'rgba(239, 68, 68, 0.3)', background: 'rgba(239, 68, 68, 0.1)' }}
                            onClick={() => handleDeletePlatform(p)}
                          >
                            🗑️ Delete
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <form onSubmit={handleAddPlatform} style={{ borderTop: '1px solid var(--card-border)', paddingTop: '1rem' }}>
                    <div className="form-group">
                      <label className="form-label">+ Add New Platform / Device</label>
                      <div style={{ display: 'flex', gap: '0.5rem' }}>
                        <input 
                          type="text" 
                          className="form-input"
                          placeholder="e.g. FOTA App, Smartwatch, Mac"
                          value={newPlatformName}
                          onChange={(e) => setNewPlatformName(e.target.value)}
                          required
                        />
                        <button type="submit" className="btn-primary" style={{ whiteSpace: 'nowrap' }}>
                          + Add
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Global Error Boundary for Standalone Browser Execution
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Dashboard Render Error:", error, errorInfo);
      }
      handleReset = () => {
        localStorage.removeItem('quin_portable_bugs');
        localStorage.removeItem('quin_portable_builds');
        localStorage.removeItem('quin_portable_user');
        window.location.reload();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="landing-container">
              <div className="landing-card" style={{ maxWidth: '540px' }}>
                <div className="landing-logo" style={{ background: '#ef4444', color: '#fff' }}>⚠️ RECOVERY MODE</div>
                <h2 className="landing-title">Dashboard Recovery</h2>
                <p className="landing-sub">
                  An error occurred while loading cached data. Click below to clear local storage cache and restore default data.
                </p>
                <div style={{ background: '#090d16', border: '1px solid rgba(239, 68, 68, 0.4)', borderRadius: 8, padding: '0.75rem', marginBottom: '1rem', fontSize: '0.8rem', color: '#f87171', fontFamily: 'monospace', textAlign: 'left' }}>
                  {this.state.error?.toString()}
                </div>
                <button className="btn-primary" style={{ width: '100%', justifyContent: 'center', background: '#ef4444' }} onClick={this.handleReset}>
                  ↺ Clear Cache & Restore Default View
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <StandaloneDashboard />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
